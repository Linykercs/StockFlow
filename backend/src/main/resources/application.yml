spring:
  application:
    name: stockflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD:stockflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

stockflow:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-stockflow-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  regras:
    dias-alerta-validade: ${DIAS_ALERTA_VALIDADE:7}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    br.com.stockflow: INFO
